# Local development stack. Everything here is throwaway: the credentials are
# fixed, DEBUG is on, and the demo workspace is seeded on first boot.
# For a real deployment use docker-compose.prod.yml instead.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_sandbox
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The database is only reachable from the other containers. If you want to
    # connect from your machine, add:
    #   ports:
    #     - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d api_sandbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      POSTGRES_DB: api_sandbox
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      SANDBOX_BASE_URL: http://localhost:8000
      # Creates the demo workspace and endpoint on first boot.
      SEED_DEMO: "True"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      - backend

volumes:
  postgres_data:
