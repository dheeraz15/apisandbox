name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check
        env:
          SECRET_KEY: ci-secret-key
          USE_SQLITE: "True"

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run
        env:
          SECRET_KEY: ci-secret-key
          USE_SQLITE: "True"

      - name: Run tests
        run: python manage.py test
        env:
          SECRET_KEY: ci-secret-key
          USE_SQLITE: "True"

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  stack:
    name: Docker stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the backend to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/healthz > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 5
          done
          echo "backend did not come up in time"
          docker compose logs backend
          exit 1

      - name: Call the seeded mock endpoint
        run: |
          body=$(curl -fsS -X POST http://localhost:8000/api/demo/account/verify \
            -H "Content-Type: application/json" \
            -d '{"accountNumber": "1001234567"}')
          echo "$body"
          echo "$body" | grep -q '"verified": *true'

      - name: Check a rule fires
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST http://localhost:8000/api/demo/account/verify \
            -H "Content-Type: application/json" \
            -d '{"accountNumber": "9900000001"}')
          echo "frozen account returned $code"
          [ "$code" = "403" ]

      - name: Check the frontend is serving
        run: curl -fsS -o /dev/null http://localhost:3000

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
